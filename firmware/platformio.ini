; Firmware dos pets. Uma env por placa; os pinos ficam em include/placa.h.
;
;   pio run                    compila (placa padrão)
;   pio run -t upload          grava na placa
;   pio device monitor         abre a serial (115200)

[platformio]
default_envs = devkit_v1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    bblanchon/ArduinoJson@^7
    tzapu/WiFiManager@^2.0.17

; ESP32 DevKit V1 (ESP32-WROOM-32, 4 MB de flash, sem PSRAM)
[env:devkit_v1]
board = esp32doit-devkit-v1
build_flags = -D PLACA_DEVKIT_V1
board_build.partitions = particoes.csv
board_build.filesystem = littlefs
